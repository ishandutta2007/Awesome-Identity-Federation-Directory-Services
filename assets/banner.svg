<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orb-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 17px;
        fill: #94a3b8;
      }
      .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      /* Subtle CSS Animations */
      @keyframes pulse-slow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.12); }
      }
      @keyframes float-gentle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -80; }
      }
      .orb-1 {
        animation: pulse-slow 8s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .orb-2 {
        animation: pulse-slow 10s ease-in-out infinite alternate;
        transform-origin: 1000px 260px;
      }
      .federation-network {
        animation: float-gentle 6s ease-in-out infinite;
      }
      .signal-line {
        stroke-dasharray: 6 6;
        animation: dash 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="90" r="140" fill="#6366f1" opacity="0.35" filter="url(#orb-blur)" />
  <circle class="orb-2" cx="980" cy="270" r="160" fill="#a855f7" opacity="0.3" filter="url(#orb-blur)" />
  <circle cx="600" cy="180" r="100" fill="#06b6d4" opacity="0.15" filter="url(#orb-blur)" />

  <!-- Subtle Dynamic Federation Constellation Graphic (Background Accent) -->
  <g class="federation-network" opacity="0.45">
    <!-- Outer Nodes and Connector Lines -->
    <line x1="860" y1="90" x2="1020" y2="70" stroke="url(#primary-glow)" stroke-width="1.5" class="signal-line" />
    <line x1="1020" y1="70" x2="1110" y2="150" stroke="url(#primary-glow)" stroke-width="1.5" class="signal-line" />
    <line x1="1020" y1="70" x2="980" y2="200" stroke="url(#primary-glow)" stroke-width="1.5" class="signal-line" />
    <line x1="980" y1="200" x2="1090" y2="250" stroke="url(#primary-glow)" stroke-width="1.5" class="signal-line" />
    <line x1="860" y1="90" x2="980" y2="200" stroke="url(#primary-glow)" stroke-width="1.5" />

    <!-- Network Dots / Key Rings -->
    <circle cx="860" cy="90" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1020" cy="70" r="7" fill="#818cf8" filter="url(#glow)" />
    <circle cx="1110" cy="150" r="4" fill="#c084fc" />
    <circle cx="980" cy="200" r="9" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="1090" cy="250" r="6" fill="#f43f5e" />

    <!-- Mini Pulse Ring around central node -->
    <circle cx="980" cy="200" r="18" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6">
      <animate attributeName="r" values="10;24;10" dur="4s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, and Pills (Clear & Visible) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 48)">
      <rect width="260" height="30" rx="15" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" />
      <text x="30" y="19" class="badge-label" fill="#a5b4fc">ENTERPRISE IAM &amp; SSO DIRECTORY</text>
    </g>

    <!-- Main Title (Gradient Fill, Crisp & Prominent in Foreground) -->
    <text x="0" y="130" class="title-text" fill="url(#primary-glow)">
      Awesome Identity Federation
    </text>
    <text x="0" y="176" class="title-text" fill="#ffffff">
      &amp; Directory Services 🔐
    </text>

    <!-- Subtitle (Informative & Legible) -->
    <text x="0" y="222" class="subtitle-text">
      Curated showcase of top SaaS identity platforms &amp; open-source IdP, SAML/OIDC federation,
    </text>
    <text x="0" y="246" class="subtitle-text">
      centralized directory services (LDAP/AD), modern SSO, and Zero Trust access management.
    </text>

    <!-- Tech Pills Row -->
    <g transform="translate(0, 280)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="32" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="14" y="20" class="badge-label">🔑 SAML 2.0</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(124, 0)">
        <rect width="135" height="32" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="14" y="20" class="badge-label">🌐 OIDC / OAuth2</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(271, 0)">
        <rect width="145" height="32" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="14" y="20" class="badge-label">📂 LDAP &amp; Active Dir</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(428, 0)">
        <rect width="128" height="32" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="14" y="20" class="badge-label">⚡ Multi-Tenant SSO</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(568, 0)">
        <rect width="126" height="32" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="14" y="20" class="badge-label">🛡️ Zero Trust IdP</text>
      </g>
    </g>
  </g>
</svg>
