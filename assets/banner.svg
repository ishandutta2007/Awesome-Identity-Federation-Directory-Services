<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b19"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1035"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".3"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="orb-blur" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur stdDeviation="50"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulse-slow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.12)}}@keyframes float-gentle{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.badge-label,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:38px;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:17px;fill:#94a3b8}.badge-label{font-size:12px;font-weight:600;fill:#e2e8f0}.orb-1{animation:pulse-slow 8s ease-in-out infinite alternate;transform-origin:200px 100px}.orb-2{animation:pulse-slow 10s ease-in-out infinite alternate;transform-origin:1000px 260px}.federation-network{animation:float-gentle 6s ease-in-out infinite}.signal-line{stroke-dasharray:6 6;animation:dash 12s linear infinite}</style></defs><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><circle cx="220" cy="90" r="140" fill="#6366f1" class="orb-1" filter="url(#orb-blur)" opacity=".35"/><circle cx="980" cy="270" r="160" fill="#a855f7" class="orb-2" filter="url(#orb-blur)" opacity=".3"/><circle cx="600" cy="180" r="100" fill="#06b6d4" filter="url(#orb-blur)" opacity=".15"/><g class="federation-network" opacity=".45"><line x1="860" x2="1020" y1="90" y2="70" stroke="url(#primary-glow)" stroke-width="1.5" class="signal-line"/><line x1="1020" x2="1110" y1="70" y2="150" stroke="url(#primary-glow)" stroke-width="1.5" class="signal-line"/><line x1="1020" x2="980" y1="70" y2="200" stroke="url(#primary-glow)" stroke-width="1.5" class="signal-line"/><line x1="980" x2="1090" y1="200" y2="250" stroke="url(#primary-glow)" stroke-width="1.5" class="signal-line"/><line x1="860" x2="980" y1="90" y2="200" stroke="url(#primary-glow)" stroke-width="1.5"/><circle cx="860" cy="90" r="5" fill="#38bdf8" filter="url(#glow)"/><circle cx="1020" cy="70" r="7" fill="#818cf8" filter="url(#glow)"/><circle cx="1110" cy="150" r="4" fill="#c084fc"/><circle cx="980" cy="200" r="9" fill="#06b6d4" filter="url(#glow)"/><circle cx="1090" cy="250" r="6" fill="#f43f5e"/><circle cx="980" cy="200" r="18" fill="none" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1"><animate attributeName="r" dur="4s" repeatCount="indefinite" values="10;24;10"/><animate attributeName="stroke-opacity" dur="4s" repeatCount="indefinite" values="0.8;0;0.8"/></circle></g><g><g transform="translate(80, 0) translate(0, 48)"><rect width="260" height="30" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="4.5" fill="#10b981"/><text x="30" y="19" fill="#a5b4fc" class="badge-label">ENTERPRISE IAM &amp; SSO DIRECTORY</text></g><text x="0" y="130" fill="url(#primary-glow)" class="title-text" transform="translate(80, 0)">Awesome Identity Federation</text><text x="0" y="176" fill="#fff" class="title-text" transform="translate(80, 0)">&amp; Directory Services 🔐</text><text x="0" y="222" class="subtitle-text" transform="translate(80, 0)">Curated showcase of top SaaS identity platforms &amp; open-source IdP, SAML/OIDC federation,</text><text x="0" y="246" class="subtitle-text" transform="translate(80, 0)">centralized directory services (LDAP/AD), modern SSO, and Zero Trust access management.</text><g><g transform="translate(80, 0) translate(0, 280) translate(0, 0)"><rect width="112" height="32" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="8"/><text x="14" y="20" class="badge-label">🔑 SAML 2.0</text></g><g transform="translate(80, 0) translate(0, 280) translate(124, 0)"><rect width="135" height="32" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="8"/><text x="14" y="20" class="badge-label">🌐 OIDC / OAuth2</text></g><g transform="translate(80, 0) translate(0, 280) translate(271, 0)"><rect width="145" height="32" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="8"/><text x="14" y="20" class="badge-label">📂 LDAP &amp; Active Dir</text></g><g transform="translate(80, 0) translate(0, 280) translate(428, 0)"><rect width="128" height="32" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="8"/><text x="14" y="20" class="badge-label">⚡ Multi-Tenant SSO</text></g><g transform="translate(80, 0) translate(0, 280) translate(568, 0)"><rect width="126" height="32" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="8"/><text x="14" y="20" class="badge-label">🛡️ Zero Trust IdP</text></g></g></g></svg>